apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetal-health-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fetal-health-api
  template:
    metadata:
      labels:
        app: fetal-health-api
    spec:
      containers:
        - name: api
          image: fetal-health-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi