name: Lab 9 - Failure Handling

on:
  push:
  pull_request:

jobs:
  failure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_failure_handling.py