name: Lab 13 - End-to-End Runner

on:
  workflow_dispatch:

jobs:
  api-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pipelines.run_lab4_tracking
      - run: python -m pipelines.run_lab7_deployment
      - run: python -m pipelines.run_lab13_end_to_end
      - uses: actions/upload-artifact@v4
        with:
          name: fetal-health-api-report
          path: artifacts/api_test_report.json