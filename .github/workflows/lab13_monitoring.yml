name: Lab 13 - Data Monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pipelines.run_lab12_monitoring --reference data/raw/fetal_health.csv --current data/raw/fetal_health.csv
      - uses: actions/upload-artifact@v4
        with:
          name: fetal-health-monitoring-report
          path: reports/lab12_monitoring_report.json